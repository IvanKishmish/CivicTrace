name: civictrace

services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/backend/CivicTrace.WebApi/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      APPLY_MIGRATIONS: "true"
      Seed__ImportProcurements: "true"
      Seed__ProcurementsPath: /app/data/procurements.seed.json
      Seed__RentalsCsvPath: /app/data/listProzorroSales.csv
      OpenApi__Enabled: "true"
      Frontend__RootPath: /app/frontend
      LOG_DIRECTORY: /app/logs
    ports:
      - "8080:8080"
    volumes:
      - api-logs:/app/logs

volumes:
  db-data:
  api-logs: